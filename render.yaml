# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ecomm-laravel
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: PORT
        value: '80'
      # ---- Laravel ----
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_URL
        value: https://ecomm-laravel.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: en
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: '120'
      - key: SESSION_EXPIRE_ON_CLOSE
        value: 'true'
      - key: SESSION_MAX_ACTIVE_HOURS
        value: '24'
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: b2
      # ---- Backblaze B2 (upload foto/produk dll, disk FILESYSTEM_DISK=b2) ----
      - key: B2_ENABLED
        value: 'true'
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        value: us-west-004
      - key: B2_ENDPOINT
        value: https://s3.us-west-004.backblazeb2.com
      - key: B2_USE_PATH_STYLE_ENDPOINT
        value: 'true'
      - key: MAIL_MAILER
        value: log
      # ---- TiDB Cloud (MySQL compatible) ----
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: <ganti-dengan-host>.tidbcloud.com
      - key: DB_PORT
        value: '4000'
      - key: DB_DATABASE
        value: eshop
      - key: DB_USERNAME
        value: <ganti-dengan-username>
      - key: DB_PASSWORD
        sync: false
      # ---- RajaOngkir ----
      - key: RAJAONGKIR_API_KEY
        sync: false
      - key: RAJAONGKIR_BASE_URL
        value: https://rajaongkir.komerce.id/api/v1
      # ---- Midtrans ----
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: 'true'
      - key: MIDTRANS_IS_SANITIZED
        value: 'true'
      - key: MIDTRANS_IS_3DS
        value: 'true'
      - key: MIDTRANS_FINISH_REDIRECT_URL
        value: https://ecomm-laravel.onrender.com/pelanggan_data/statusBayar
      - key: MIDTRANS_UNFINISH_REDIRECT_URL
        value: https://ecomm-laravel.onrender.com/pelanggan_data/statusBayar
      - key: MIDTRANS_ERROR_REDIRECT_URL
        value: https://ecomm-laravel.onrender.com/pelanggan_data/statusBayar
      - key: MIDTRANS_CALLBACK_URL
        value: https://ecomm-laravel.onrender.com/midtrans/callback
      # ---- Google OAuth ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://ecomm-laravel.onrender.com/auth/google/callback